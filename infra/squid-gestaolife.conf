# Proxy HTTP autenticado do Gestão Life.
# A porta é preenchida por infra/preparar-proxy durante a instalação.
http_port __PORTA__

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/gestaolife.passwd
auth_param basic children 5 startup=1 idle=1
auth_param basic realm GestaoLifeProxy
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive on

acl usuarios_autenticados proxy_auth REQUIRED
acl CONNECT method CONNECT
acl portas_ssl port 443
acl portas_seguras port 80
acl portas_seguras port 443

# Impede que o proxy alcance serviços locais, redes privadas e endereços
# especiais. Assim ele não serve como ponte para Jenkins, API ou metadados.
acl destinos_privados dst 0.0.0.0/8
acl destinos_privados dst 10.0.0.0/8
acl destinos_privados dst 100.64.0.0/10
acl destinos_privados dst 127.0.0.0/8
acl destinos_privados dst 169.254.0.0/16
acl destinos_privados dst 172.16.0.0/12
acl destinos_privados dst 192.168.0.0/16
acl destinos_privados dst 224.0.0.0/4
acl destinos_privados dst 240.0.0.0/4
acl destinos_privados dst ::1/128
acl destinos_privados dst fc00::/7
acl destinos_privados dst fe80::/10

http_access deny !portas_seguras
http_access deny CONNECT !portas_ssl
http_access deny destinos_privados
http_access allow usuarios_autenticados
http_access deny all

# O proxy apenas encaminha tráfego; não mantém cache de conteúdo.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

forwarded_for delete
via off
visible_hostname gestaolife-proxy
